---
- name: Install and configure Nginx
  hosts: all
  become: yes
  vars:
    nginx_port: 80
  
  tasks:
    - name: Install Nginx
      package:
        name: nginx
        state: present
      notify: restart nginx

    - name: Copy HTML file
      copy:
        src: files/index.html
        dest: /usr/share/nginx/html/index.html
        owner: root
        group: root
        mode: '0644'

    - name: Copy Nginx configuration file
      copy:
        src: files/nginx.conf
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart nginx

    - name: Ensure Nginx is running and enabled
      service:
        name: nginx
        state: started
        enabled: yes

  handlers:
    - name: restart nginx
      service:
        name: nginx
        state: restarted